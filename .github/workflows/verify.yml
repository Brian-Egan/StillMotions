# Pipeline verification. Runs on the self-hosted macOS runner so it costs no GitHub
# minutes and has Xcode, Rust, and the toolchain already present.
# Runner setup is in docs/RUNBOOK.md ("Set up the runner"); the topology is in
# docs/ARCHITECTURE.md §9.
#
# The job is named `verify`. The build agent waits for it with
# `gh pr checks --watch --fail-fast` and merges only if it passes.
#
# It runs on EVERY pull request, with no path filter. Branch protection is unavailable on a
# private repo under a GitHub Free personal account, so the agent enforces the gate itself by
# refusing to merge a red or missing check. A path filter would mean some pull requests have no
# check at all, and "no check" is indistinguishable from "check has not started yet" — so the
# agent would have to guess. Running on everything costs a couple of minutes of your own
# hardware and removes the ambiguity.
#
# This deliberately does NOT run xcodebuild. Signing an iOS build unattended needs keychain
# unlock and fails in exactly the overnight conditions this is meant to support. App builds
# are covered by the `human` on-device verification issues.

name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per branch; cancel superseded runs so an overnight agent pushing repeatedly
  # does not queue a backlog on a single-runner setup.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version || true
          cargo --version || echo "cargo missing — gifski build will fail if CGifski is active"

      # gifski takes minutes to build from Rust source and changes only when the pinned
      # version or the build script changes. Cache on both.
      - name: Cache gifski xcframework
        id: gifski-cache
        uses: actions/cache@v4
        with:
          path: Vendor/Gifski.xcframework
          key: gifski-${{ runner.os }}-${{ hashFiles('scripts/build-gifski.sh') }}

      - name: Build gifski
        if: steps.gifski-cache.outputs.cache-hit != 'true'
        run: |
          # Only needed once CGifski is an active dependency. Until then the commented-out
          # binaryTarget in Package.swift means the package builds without it.
          if grep -qE '^\s*\.binaryTarget\(name: "CGifski"' Package.swift; then
            ./scripts/build-gifski.sh
          else
            echo "CGifski not yet active in Package.swift — skipping"
          fi

      - name: Verify
        run: ./scripts/verify.sh

      # Contact sheets and metrics are the evidence for a quality regression. Keep them
      # even on failure — especially on failure.
      - name: Upload harness output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-output
          path: harness/out/
          if-no-files-found: ignore
          retention-days: 14
