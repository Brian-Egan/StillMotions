# XcodeGen manifest. See docs/decisions/0006-project-generator.md.
#
# StillMotions.xcodeproj is a build artifact and is gitignored. Run `xcodegen generate`
# before any xcodebuild invocation. Never hand-edit the generated project.

name: StillMotions

# Bundle identifiers deliberately use `Still-Motions`, not `StillMotions`.
#
# The hyphen is historical: the project began on a free personal team, which claims explicit
# App IDs permanently. The developer now has a paid membership, but the identifiers are registered
# and changing them makes iOS treat the build as a different app. See "Paid membership notes" in
# docs/RUNBOOK.md.

options:
  bundleIdPrefix: com.began
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Fail loudly rather than silently generating a project that references missing files.
  disabledValidations: []

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Set by the signing issue. This is the developer's paid team ID; Xcode registers the
    # App IDs for you under automatic signing.
    DEVELOPMENT_TEAM: "G42X3PN636"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1" # iPhone only. iPad layouts are a non-goal (PRD §0).
    # Apple silicon only, as decision 0004 says: Vendor/Gifski.xcframework has arm64 slices only
    # (device, simulator, macOS). `generic/platform=iOS Simulator` otherwise also builds x86_64
    # and fails to link, which broke the simulator build when gifski became a dependency (#16).
    # To support Intel simulators, add x86_64-apple-ios to scripts/build-gifski.sh instead.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  StillMotionsPipeline:
    path: .

targets:
  # The app. Links the pipeline and gifski. Owns all PhotoKit access, all UI, and the
  # editor. See docs/ARCHITECTURE.md §1.
  StillMotions:
    type: application
    platform: iOS
    sources:
      - path: App/StillMotions
    dependencies:
      - package: StillMotionsPipeline
        product: StillMotionsPipeline
      - target: StillMotionsShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.began.Still-Motions
        # StillMotionsShare gets its Info.plist from an explicit `info:` block below;
        # this target only sets INFOPLIST_KEY_* values, which needs GENERATE_INFOPLIST_FILE
        # or there is no plist for Xcode to embed and codesign fails before signing is
        # ever reached (issue #6).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StillMotions
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          StillMotions reads Live Photos from your library so it can stabilize them.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: >-
          StillMotions saves exported GIFs and videos to your library.
    entitlements:
      path: App/StillMotions/StillMotions.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.began.Still-Motions

  # Share extension. A drop box only: copies the asset into the App Group container and
  # exits. It deliberately does NOT depend on StillMotionsPipeline — if it ever does, the
  # drop-box decision has been violated. See docs/decisions/0003-extension-strategy.md.
  StillMotionsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/StillMotionsShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.began.Still-Motions.Share
    info:
      path: App/StillMotionsShare/Info.plist
      properties:
        # Set here, not via INFOPLIST_KEY_*: this target uses a hand-managed plist, so the
        # build-setting form is ignored. A device install rejects the appex without it (#44).
        CFBundleDisplayName: StillMotions
        # Must match the containing app or Xcode warns and the installer may reject it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: App/StillMotionsShare/StillMotionsShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.began.Still-Motions

schemes:
  StillMotions:
    build:
      targets:
        StillMotions: all
    run:
      config: Debug
    archive:
      config: Release
